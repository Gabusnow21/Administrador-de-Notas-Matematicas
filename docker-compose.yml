services:
  db:
    image: postgres:15-alpine
    container_name: gestor_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gestor_network

  backend:
    build: ./backend
    container_name: gestor_backend
    restart: always
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${JDBC_DATABASE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - gestor_network
      - proxy-network

  frontend:
    build: ./frontend
    container_name: gestor_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - gestor_network
      - proxy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy-network'
      - 'traefik.http.routers.gestor-frontend.rule=Host(`gestor.edumathsv.work`)'
      - 'traefik.http.routers.gestor-frontend.entrypoints=web'
      - 'traefik.http.services.gestor-frontend.loadbalancer.server.port=80'

volumes:
  postgres_data:

networks:
  gestor_network:
    driver: bridge
  proxy-network:
    external: true
