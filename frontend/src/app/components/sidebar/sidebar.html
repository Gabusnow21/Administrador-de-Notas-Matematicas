<nav class="sidebar" [class.expanded]="isExpanded" id="sidebar" aria-label="Navegación principal" role="navigation">
  <div class="sidebar-header">
    <button 
      class="btn btn-link text-white p-0 me-2" 
      (click)="toggle()" 
      [title]="isExpanded ? 'Cerrar menú' : 'Abrir menú'" 
      [attr.aria-expanded]="isExpanded" 
      aria-controls="sidebar-nav"
      aria-label="Toggle navigation menu">
        <i class="bi fs-2" [class.bi-list]="!isExpanded" [class.bi-x]="isExpanded" aria-hidden="true"></i>
    </button>
    <a class="sidebar-brand fw-bold" href="/dashboard" aria-label="Gestor de Notas - Dashboard">
      <i class="bi bi-mortarboard-fill me-2" aria-hidden="true"></i>
      <span class="brand-text">Gestor de Notas</span>
    </a>
  </div>

  <ul class="nav nav-pills flex-column mb-auto" id="sidebar-nav" role="menubar">
    <li class="nav-item" role="none">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Dashboard' : ''">
        <i class="bi bi-house-door-fill" aria-hidden="true"></i>
        <span class="link-text">Dashboard</span>
      </a>
    </li>

    @if (authService.isAdmin()) {
      <li class="nav-item-header" role="separator"><span class="link-text">ADMINISTRACIÓN</span></li>
      <li class="nav-item" role="none">
        <a routerLink="/configuracion/usuarios" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Usuarios' : ''">
          <i class="bi bi-people-fill" aria-hidden="true"></i>
          <span class="link-text">Usuarios</span>
        </a>
      </li>
      <li class="nav-item" role="none">
        <a routerLink="/configuracion/trimestres" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Trimestres' : ''">
          <i class="bi bi-calendar-check" aria-hidden="true"></i>
          <span class="link-text">Trimestres</span>
        </a>
      </li>
    }

    @if (authService.isAdmin() || authService.isTeacher()) {
      <li class="nav-item-header" role="separator"><span class="link-text">GESTIÓN ACADÉMICA</span></li>
      <li class="nav-item" role="none">
        <a routerLink="/configuracion/materias" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Materias' : ''">
          <i class="bi bi-journal-bookmark-fill" aria-hidden="true"></i>
          <span class="link-text">Materias</span>
        </a>
      </li>
      <li class="nav-item" role="none">
        <a routerLink="/configuracion/actividades" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Actividades' : ''">
          <i class="bi bi-list-check" aria-hidden="true"></i>
          <span class="link-text">Actividades</span>
        </a>
      </li>
      <li class="nav-item" role="none">
        <a routerLink="/gestion-asistencia" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Asistencia' : ''">
          <i class="bi bi-person-check-fill" aria-hidden="true"></i>
          <span class="link-text">Asistencia</span>
        </a>
      </li>
      <li class="nav-item" role="none">
        <a routerLink="/gestion-recompensas" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Recompensas' : ''">
          <i class="bi bi-award-fill" aria-hidden="true"></i>
          <span class="link-text">Recompensas</span>
        </a>
      </li>
      <li class="nav-item" role="none">
        <a routerLink="/nfc-terminal" routerLinkActive="active" class="nav-link" role="menuitem" [title]="!isExpanded ? 'Terminal NFC' : ''">
          <i class="bi bi-broadcast" aria-hidden="true"></i>
          <span class="link-text">Terminal NFC</span>
        </a>
      </li>
    }
  </ul>
</nav>
