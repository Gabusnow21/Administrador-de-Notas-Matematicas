<div class="download-container">
    <div class="card shadow-lg border-0">
        <div class="card-body p-5">
            <div class="text-center">
                <div class="mb-4">
                    <i class="bi bi-file-earmark-pdf display-1 text-danger"></i>
                </div>
                <h2 class="fw-bold mb-2" style="font-family: var(--font-heading);">Descargar Boleta</h2>
                <p class="text-muted mb-4">Ingresa el NIE del estudiante para obtener su boleta en PDF.</p>

                <form (ngSubmit)="onSubmit()" #downloadForm="ngForm">
                    <div class="mb-3">
                        <label for="nieInput" class="form-label fw-semibold text-start d-block">NIE del Estudiante</label>
                        <input
                            type="text"
                            id="nieInput"
                            name="nieInput"
                            [(ngModel)]="nie"
                            (ngModelChange)="onNieInput()"
                            placeholder="Ej: 10179258"
                            maxlength="8"
                            required
                            class="form-control form-control-lg text-center"
                            style="max-width: 250px; margin: 0 auto; border-radius: var(--radius-lg); font-size: 1.25rem;">
                        <small class="text-muted d-block mt-1">El NIE es el código de 8 dígitos del estudiante</small>
                    </div>

                    @if (checkingNie) {
                        <div class="text-muted small mb-3">
                            <span class="spinner-border spinner-border-sm me-1"></span> Verificando disponibilidad...
                        </div>
                    }

                    @if (nieAvailable && nombreEstudiante) {
                        <div class="alert alert-success py-2 mb-3 d-flex align-items-center justify-content-center">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span>Boleta de <strong>{{ nombreEstudiante }}</strong></span>
                        </div>
                    }

                    <button type="submit" [disabled]="downloading || !nieAvailable"
                            class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold"
                            style="max-width: 300px; margin: 0 auto; display: block; min-height: 3rem;">
                        @if (downloading) {
                            <span class="spinner-border spinner-border-sm me-2"></span> Descargando...
                        } @else {
                            <i class="bi bi-download me-2"></i> Descargar PDF
                        }
                    </button>
                </form>

                @if (error) {
                    <div class="alert alert-danger mt-4 d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>{{ error }}</div>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
